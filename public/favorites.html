<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收藏帖子 · X 书签</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:#15202b; color:#e7e9ea; overflow:hidden;
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; }
  header { position:sticky; top:0; z-index:20; background:#15202b; border-bottom:1px solid #38444d;
    padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; flex:none; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  .total { color:#8b98a5; font-size:13px; }
  .spacer { flex:1; }
  input[type=date] { background:#192734; color:#e7e9ea; border:1px solid #38444d; border-radius:8px; padding:7px 10px; font-size:13px; }
  button { background:#1d9bf0; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.ghost { background:#192734; color:#e7e9ea; border:1px solid #38444d; }
  #status { font-size:12px; color:#8b98a5; min-width:120px; }

  #viewport { flex:1; overflow-y:auto; overflow-x:hidden; padding:16px 14px 80px; position:relative; }
  .vl-layer { max-width:720px; margin:0 auto; }
  .vrow { padding-bottom:14px; }

  .card { background:#192734; border:1px solid #38444d; border-radius:14px; padding:14px 16px; }
  .card.flash { box-shadow:0 0 0 3px #1d9bf0, 0 0 24px #1d9bf0; }
  .head { display:flex; align-items:center; gap:10px; }
  .av { width:42px; height:42px; border-radius:50%; object-fit:cover; background:#22303c; flex:none; }
  .who { flex:1; min-width:0; }
  .name { font-weight:700; font-size:15px; }
  .handle { color:#8b98a5; font-weight:400; margin-left:6px; }
  .meta-line { font-size:12px; color:#8b98a5; margin-top:2px; }
  .text { margin:10px 0; font-size:15px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .lnk { color:#1d9bf0; text-decoration:none; }
  .lnk:hover { text-decoration:underline; }
  .imgs { display:grid; gap:6px; margin:10px 0; border-radius:12px; overflow:hidden; align-items:start; }
  .imgs-1 { grid-template-columns:1fr; }
  .imgs-2 { grid-template-columns:1fr 1fr; }
  .imgs-3 { grid-template-columns:1fr 1fr; } .imgs-3 a:first-child { grid-column:1 / span 2; }
  .imgs-4 { grid-template-columns:1fr 1fr; }
  .imgs a { display:block; overflow:hidden; background:#22303c; border-radius:8px; cursor:zoom-in; transition:filter .15s; }
  .imgs a:hover { filter:brightness(1.06); }
  .imgs img { width:100%; height:auto; display:block; border-radius:8px; background:#22303c; }
  .imgs-1 img { max-height:760px; object-fit:cover; }
  .stats { font-size:13px; color:#8b98a5; margin-top:8px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
  .stats .plink { color:#1d9bf0; text-decoration:none; margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>收藏帖子</h1>
  <span class="total" id="total">加载中…</span>
  <div class="spacer"></div>
  <input type="date" id="jumpDate" title="跳转到该日期附近发布的帖子（按发布时间）">
  <button class="ghost" id="jumpBtn">跳转</button>
  <button id="topBtn">回到顶部</button>
  <button class="ghost" id="backBtn">← 返回全部</button>
  <span id="status"></span>
</header>

<div id="viewport"></div>

<script src="virtual-scroll.js"></script>
<script src="lightbox.js"></script>
<script src="gallery.js"></script>
<script>
const viewport = document.getElementById('viewport');
const statusEl = document.getElementById('status');
const totalEl = document.getElementById('total');

let imgStates = {};
async function loadStates() {
  try { imgStates = await (await fetch('/api/image-states')).json(); } catch (e) { imgStates = {}; }
}
const lb = Lightbox.create({
  getState: (base) => imgStates[base] || null,
  onToggleFavorite: async (base) => {
    const r = await fetch('/api/image-state', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base }),
    }).then((x) => x.json());
    const fav = !!r.favorited;
    if (imgStates[base]) imgStates[base].favorited = fav;
    else imgStates[base] = { favorited: fav };
    return fav;
  },
});

// 与 index.html 同构：复用卡片渲染/虚拟滚动/灯箱；唯一差异：独立滚动 key + 独立数据源
const g = Gallery.setup({
  viewport, statusEl, totalEl,
  scrollKey: 'xbook:scrollPos:favorites',
  endpoint: '/api/favorite-posts',
  lightbox: lb,
});

document.getElementById('jumpBtn').onclick = () => g.jump(document.getElementById('jumpDate').value);
document.getElementById('topBtn').onclick = () => g.vlist.scrollToTop();
document.getElementById('backBtn').onclick = () => { window.location.href = '/'; };

(async () => { await loadStates(); await g.loadAll(); })();
</script>
</body>
</html>
