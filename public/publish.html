<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布到小红书 · X 书签</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#15202b; color:#e7e9ea;
    font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
  header { position:sticky; top:0; z-index:20; background:#15202b; border-bottom:1px solid #38444d;
    padding:12px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:17px; margin:0 12px 0 0; }
  .spacer { flex:1; }
  button { background:#1d9bf0; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  button.ghost { background:#192734; color:#e7e9ea; border:1px solid #38444d; }
  button:disabled { opacity:.5; cursor:default; }
  input[type=text], input[type=date], input[type=time], textarea { background:#192734; color:#e7e9ea; border:1px solid #38444d; border-radius:8px; padding:8px 10px; font-size:13px; width:100%; }
  label { font-size:13px; color:#8b98a5; display:block; margin:10px 0 4px; }
  #status { font-size:12px; color:#8b98a5; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  .panel { background:#192734; border:1px solid #38444d; border-radius:14px; padding:14px 16px; }
  .panel h2 { font-size:15px; margin:0 0 8px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:8px; max-height:60vh; overflow:auto; padding:4px; }
  .cell { position:relative; border:2px solid transparent; border-radius:10px; overflow:hidden; cursor:pointer; background:#22303c; }
  .cell.sel { border-color:#1d9bf0; }
  .cell img { width:100%; height:120px; object-fit:cover; display:block; }
  .cell .chk { position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:4px; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; font-size:13px; }
  .cell.sel .chk { background:#1d9bf0; }
  .cell .fav { position:absolute; top:4px; right:4px; font-size:14px; }
  .cell .eye { position:absolute; bottom:4px; right:4px; background:rgba(0,0,0,.5); border-radius:4px; padding:2px 6px; font-size:12px; }
  #log { background:#0e1620; border:1px solid #38444d; border-radius:8px; padding:10px; font-size:12px; max-height:200px; overflow:auto; white-space:pre-wrap; }
  .hint { font-size:12px; color:#8b98a5; padding:8px 4px; }
  .loadmore { font-size:12px; color:#8b98a5; text-align:center; padding:10px; }
  @media (max-width:820px){ .wrap{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<header>
  <h1>发布到小红书</h1>
  <button class="ghost" id="backBtn">← 返回</button>
  <div class="spacer"></div>
  <span id="status"></span>
</header>

<div class="wrap">
  <!-- 左：模板 + 发布设置 -->
  <div>
    <div class="panel">
      <h2>① 发帖模板</h2>
      <div class="row">
        <select id="tplSelect" style="flex:1"><option value="">— 选择模板 / 空白 —</option></select>
        <button class="ghost" id="tplDelete">删除模板</button>
      </div>
      <label>模板名称（保存时用）</label>
      <input type="text" id="tplName" placeholder="如：AI插画默认">
      <label>标题（可用 {{author}} {{author_name}} {{author_screen_name}} {{text}} {{desc}} {{date}} {{post_date}}）</label>
      <input type="text" id="title" placeholder="标题">
      <label>正文（可用占位符：{{author}}/{{author_name}}/{{author_screen_name}} 作者、{{text}} 原帖文字、{{desc}} 手填、{{date}} 今天日期、{{post_date}} 原帖发布日期）</label>
      <textarea id="content" rows="4" placeholder="正文，换行用回车"></textarea>
      <label>话题标签（逗号分隔，须为小红书已存在话题；支持 {{author}} {{text}} {{desc}} {{date}} {{post_date}}）</label>
      <input type="text" id="tags" placeholder="AI生成,二次元">
      <div class="row" style="margin-top:10px">
        <label style="margin:0"><input type="checkbox" id="ai"> 笔记含AI合成内容声明</label>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="tplSave">保存为模板</button>
        <span class="hint">选模板会填入上方；可改后再发或再存。</span>
      </div>
    </div>

    <div class="panel" style="margin-top:18px">
      <h2>② 发布设置</h2>
      <label>描述占位符 {{desc}}（对所有选中图统一填入）</label>
      <input type="text" id="desc" placeholder="可选，如：转载请注明出处">
      <div class="row" style="margin-top:10px">
        <label style="margin:0"><input type="checkbox" id="mergeNote"> 合并为一篇多图笔记</label>
      </div>
      <div class="row" style="margin-top:10px">
        <label style="margin:0"><input type="checkbox" id="schedule"> 定时发布</label>
      </div>
      <div class="row" style="margin-top:6px; gap:10px; align-items:stretch">
        <input type="date" id="scheduleDate" style="flex:1">
        <input type="time" id="scheduleTime" style="width:110px">
      </div>
      <div class="row" style="margin-top:6px">
        <label style="margin:0"><input type="checkbox" id="scheduleSeries"> 连续发布（每篇自动+1天）</label>
      </div>
      <div class="row" style="margin-top:12px">
        <button id="publishBtn">🚀 一键发布选中图</button>
        <span class="hint" id="selCount">已选 0 张</span>
      </div>
      <div id="log" style="margin-top:10px"></div>
    </div>
  </div>

  <!-- 右：选图（懒加载 / 无限滚动）-->
  <div class="panel">
    <h2>③ 选择图片</h2>
    <div class="row" style="margin-bottom:10px">
      <button class="ghost" id="selAll">全选当前</button>
      <button class="ghost" id="selClear">清空</button>
      <label style="margin:0"><input type="checkbox" id="onlyFav" checked> 仅显示收藏图</label>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<script src="lightbox.js"></script>
<script>
const statusEl = document.getElementById('status');
const gridEl = document.getElementById('grid');
const logEl = document.getElementById('log');
const selCountEl = document.getElementById('selCount');
const onlyFavEl = document.getElementById('onlyFav');
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// ---- 数据状态 ----
let allFlat = [];           // 从 /api/bookmarks 流式累积的全部图片
let favFlat = [];           // 从 /api/favorite-posts 取得的收藏图
let flatList = allFlat;     // 当前展示的列表（active 引用）
let postMap = new Map();    // postId -> {text, author}（两来源都会积累，供发布时取正文/作者）
let states = {};
const selected = new Set(); // 以 base 为 key
const cellMap = new Map();  // base -> 已渲染的 cell 元素

// 流式抓取控制
let cursor = 0;
let loading = false;
let exhausted = false;      // all 模式是否已翻完
let mode = 'all';           // 'all' | 'fav'

const lb = Lightbox.create({
  getState: (base) => states[base] || null,
  onToggleFavorite: async (base) => {
    const r = await fetch('/api/image-state', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ base }),
    }).then((x) => x.json());
    const fav = !!r.favorited;
    states[base] = states[base] || {};
    states[base].favorited = fav;
    // fav 模式下取消收藏要从网格移除该格；其余情况原地刷新状态
    if (mode === 'fav' && !fav) {
      const cell = cellMap.get(base);
      if (cell) { cell.remove(); cellMap.delete(base); }
      if (!gridEl.querySelector('.cell')) {
        const d = document.createElement('div'); d.className = 'hint'; d.textContent = '没有图片'; gridEl.appendChild(d);
      }
    } else {
      refreshCell(base);
    }
    return fav;
  },
});

function log(s) { logEl.textContent += s + '\n'; logEl.scrollTop = logEl.scrollHeight; }

function substitute(str, ctx) {
  return String(str || '').replace(/\{\{(\w+)\}\}/g, (m, k) => (ctx[k] != null ? ctx[k] : m));
}

// ---- 模板（不变）----
async function loadTemplates() {
  const d = await (await fetch('/api/templates')).json();
  const sel = document.getElementById('tplSelect');
  sel.innerHTML = '<option value="">— 选择模板 / 空白 —</option>';
  for (const t of (d.items || [])) {
    const o = document.createElement('option');
    o.value = t.id; o.textContent = t.name;
    sel.appendChild(o);
  }
  // 默认选中第一个模板并回填标题/正文/标签（复用 onchange 逻辑）
  if (d.items && d.items.length) {
    sel.value = d.items[0].id;
    sel.dispatchEvent(new Event('change'));
  }
}
document.getElementById('tplSelect').onchange = (e) => {
  const id = e.target.value;
  if (!id) return;
  fetch('/api/templates').then((r) => r.json()).then((d) => {
    const t = (d.items || []).find((x) => x.id === id);
    if (!t) return;
    document.getElementById('title').value = t.title || '';
    document.getElementById('content').value = t.content || '';
    document.getElementById('tags').value = (t.tags || []).join(',');
    document.getElementById('ai').checked = !!t.aiDeclaration;
  });
};
document.getElementById('tplSave').onclick = async () => {
  const name = document.getElementById('tplName').value.trim();
  if (!name) { statusEl.textContent = '请填模板名称'; return; }
  const tpl = {
    name,
    title: document.getElementById('title').value,
    content: document.getElementById('content').value,
    tags: document.getElementById('tags').value.split(',').map((s) => s.trim()).filter(Boolean),
    aiDeclaration: document.getElementById('ai').checked,
  };
  const r = await fetch('/api/templates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tpl) }).then((x) => x.json());
  if (r.ok) { statusEl.textContent = '模板已保存'; await loadTemplates(); document.getElementById('tplSelect').value = r.template.id; }
  else statusEl.textContent = '保存失败: ' + (r.error || '');
};
document.getElementById('tplDelete').onclick = async () => {
  const id = document.getElementById('tplSelect').value;
  if (!id) { statusEl.textContent = '请先选择要删除的模板'; return; }
  await fetch('/api/templates', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'delete', id }) }).then((x) => x.json());
  statusEl.textContent = '模板已删除'; await loadTemplates();
};

// ---- 选图：懒加载 / 无限滚动 ----
function mediaFromPost(p) {
  if (!p.media || !p.media.length) return [];
  return p.media.map((m, mi) => {
    const base = (m.url || m.thumb || '').replace(/:\w+$/, '');
    const full = base ? base + ':large' : (m.url || m.thumb || '');
    const feed = base ? base + ':small' : (m.url || m.thumb || '');
    return { postId: p.id, mediaIdx: mi, base, full, feed };
  });
}

// 把一个图片渲染进 cell（innerHTML 重建后重绑事件，用赋值覆盖避免重复监听）
function renderCell(cell, it) {
  const fav = (states[it.base] && states[it.base].favorited) ? '♥' : '';
  const pub = (states[it.base] && states[it.base].published) ? '✅' : '';
  cell.className = 'cell' + (selected.has(it.base) ? ' sel' : '');
  cell.dataset.base = it.base;
  cell.innerHTML = `<div class="chk">${selected.has(it.base) ? '✓' : ''}</div>` +
    (fav ? `<div class="fav">${fav}</div>` : '') +
    (pub ? `<div class="fav" style="right:auto;left:4px">${pub}</div>` : '') +
    `<img loading="lazy" src="${it.feed}" alt="" onerror="this.style.opacity=.25">` +
    `<div class="eye">🔍</div>`;
  cell.querySelector('.eye').onclick = (e) => {
    e.stopPropagation();
    const idx = flatList.indexOf(it);
    lb.open(flatList, Math.max(0, idx));
  };
  cell.onclick = () => {
    if (selected.has(it.base)) selected.delete(it.base); else selected.add(it.base);
    cell.classList.toggle('sel');
    const chk = cell.querySelector('.chk');
    if (chk) chk.textContent = selected.has(it.base) ? '✓' : '';
    updateSelCount();
  };
}

function makeCell(it) { const c = document.createElement('div'); renderCell(c, it); cellMap.set(it.base, c); return c; }

// fav 模式排序：未发布的排前面，已发布的沉到最后（同组保持原顺序，稳定排序）
function isPublished(it) { return !!(states[it.base] && states[it.base].published); }
function sortedFavList(list) {
  return list.slice().sort((a, b) => (isPublished(a) ? 1 : 0) - (isPublished(b) ? 1 : 0));
}

function refreshCell(base) {
  const cell = cellMap.get(base);
  const it = flatList.find((x) => x.base === base) || allFlat.find((x) => x.base === base);
  if (cell && it) renderCell(cell, it);
}

// 全量重建当前展示列表（用于筛选切换 / 全选清空）
function renderGrid() {
  gridEl.querySelectorAll('.cell, .hint, .loadmore').forEach((n) => n.remove());
  cellMap.clear();
  let shown = 0;
  for (const it of flatList) {
    if (onlyFavEl.checked && !(states[it.base] && states[it.base].favorited)) continue;
    shown++;
    gridEl.appendChild(makeCell(it));
  }
  if (shown === 0) {
    const d = document.createElement('div'); d.className = 'hint'; d.textContent = '没有图片'; gridEl.appendChild(d);
  } else if (mode === 'all' && !exhausted) {
    const m = document.createElement('div'); m.className = 'loadmore'; m.textContent = '继续向下滚动加载更多…'; gridEl.appendChild(m);
  }
}

function updateStatus() {
  const total = (mode === 'all' ? allFlat.length : favFlat.length);
  let s = `已加载 ${total} 张图`;
  if (mode === 'all') s += exhausted ? '（已全部）' : '（继续滚动加载更多）';
  statusEl.textContent = s;
}

// all 模式：按游标流式翻页，只追加新 cell，不一次性渲染全部
async function loadNextPage() {
  if (mode !== 'all' || loading || exhausted) return;
  loading = true;
  statusEl.textContent = '加载图片…';
  try {
    const d = await (await fetch(`/api/bookmarks?cursor=${cursor}&limit=50`)).json();
    const items = d.items || [];
    for (const p of items) postMap.set(p.id, { text: p.text || '', author: p.author, created_at: p.created_at || '' });
    const imgs = items.flatMap(mediaFromPost);
    for (const it of imgs) {
      allFlat.push(it);
      if (mode === 'all') gridEl.appendChild(makeCell(it));
    }
    // 移除「加载更多」提示，避免堆积
    const m = gridEl.querySelector('.loadmore'); if (m) m.remove();
    if (d.nextCursor == null) {
      exhausted = true;
      if (allFlat.length === 0) { const d2 = document.createElement('div'); d2.className = 'hint'; d2.textContent = '没有图片'; gridEl.appendChild(d2); }
      else { const done = document.createElement('div'); done.className = 'loadmore'; done.textContent = '— 已加载全部 —'; gridEl.appendChild(done); }
    } else {
      cursor = d.nextCursor;
      if (items.length) { const more = document.createElement('div'); more.className = 'loadmore'; more.textContent = '继续向下滚动加载更多…'; gridEl.appendChild(more); }
    }
    updateStatus();
  } catch (e) {
    statusEl.textContent = '加载失败：' + e.message;
  } finally {
    loading = false;
  }
}

// fav 模式：直接取收藏帖（集合小，一次渲染即可）
async function loadFav() {
  mode = 'fav';
  statusEl.textContent = '加载收藏图…';
  try {
    const d = await (await fetch('/api/favorite-posts')).json();
    const items = d.items || [];
    for (const p of items) postMap.set(p.id, { text: p.text || '', author: p.author, created_at: p.created_at || '' });
    favFlat = items.flatMap(mediaFromPost);
    flatList = sortedFavList(favFlat);   // 已发布的沉到最后
    renderGrid();
    updateStatus();
  } catch (e) {
    statusEl.textContent = '加载失败：' + e.message;
  }
}

// 滚动接近底部时自动加载下一页
gridEl.addEventListener('scroll', () => {
  if (mode !== 'all' || loading || exhausted) return;
  if (gridEl.scrollTop + gridEl.clientHeight >= gridEl.scrollHeight - 300) loadNextPage();
});

document.getElementById('selAll').onclick = () => { for (const it of flatList) selected.add(it.base); renderGrid(); updateSelCount(); };
document.getElementById('selClear').onclick = () => { selected.clear(); renderGrid(); updateSelCount(); };
onlyFavEl.onchange = async () => {
  if (onlyFavEl.checked) {
    await loadFav();
  } else {
    mode = 'all';
    flatList = allFlat;
    if (allFlat.length === 0) { cursor = 0; exhausted = false; await loadNextPage(); }
    else renderGrid();
  }
};
function updateSelCount() { selCountEl.textContent = '已选 ' + selected.size + ' 张'; }

// ---- 发布 ----
function makeCtx(it, desc) {
  const post = postMap.get(it.postId) || {};
  const authorObj = post.author || {};
  const author = (authorObj.name || authorObj.screen_name) || '';
  const authorName = authorObj.name || '';
  const authorScreen = authorObj.screen_name || '';
  const today = new Date();
  const dateStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
  const postDate = (post.created_at || '').slice(0, 10);
  return { text: post.text || '', author, author_name: authorName, author_screen_name: authorScreen, desc, date: dateStr, post_date: postDate };
}

function addDays(dateTimeStr, days) {
  const [d, t] = dateTimeStr.split(' ');
  const date = new Date(d + 'T' + t);
  date.setDate(date.getDate() + days);
  return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')} ${t}`;
}

function markLocalPublished(base, url) {
  states[base] = states[base] || {};
  states[base].published = { url, at: new Date().toISOString() };
  refreshCell(base);
}

document.getElementById('publishBtn').onclick = async () => {
  // 合并两来源、按 base 去重（收藏图是全部图的子集）
  const seen = new Set(); const union = [];
  for (const it of [...allFlat, ...favFlat]) if (!seen.has(it.base)) { seen.add(it.base); union.push(it); }
  const items = union.filter((x) => selected.has(x.base));
  if (!items.length) { statusEl.textContent = '请先选择图片'; return; }
  const mergeNote = document.getElementById('mergeNote').checked;
  const schedule = document.getElementById('schedule').checked;
  const scheduleDate = document.getElementById('scheduleDate').value;
  const scheduleTime = document.getElementById('scheduleTime').value || '09:00';
  const scheduleSeries = document.getElementById('scheduleSeries').checked;
  const scheduledBase = schedule ? `${scheduleDate} ${scheduleTime}` : '';
  const titleT = document.getElementById('title').value;
  const contentT = document.getElementById('content').value;
  const tagsT = document.getElementById('tags').value;
  const ai = document.getElementById('ai').checked;
  const desc = document.getElementById('desc').value;
  const actionText = mergeNote ? `合并为 1 篇多图笔记` : `逐张发布 ${items.length} 篇`;
  const timeText = schedule ? (scheduleSeries && !mergeNote ? '（定时：每篇+1天）' : '（定时发布）') : '';
  if (!confirm(`确认发布 ${items.length} 张图到小红书？${actionText}${timeText}`)) return;
  const btn = document.getElementById('publishBtn');
  btn.disabled = true; logEl.textContent = '';
  let okN = 0, failN = 0;
  try {
    if (mergeNote) {
      const ctx = makeCtx(items[0], desc);
      const tags = tagsT.split(',').map((s) => substitute(s.trim(), ctx)).filter(Boolean);
      const payload = {
        imageUrls: items.map((it) => it.full),
        title: substitute(titleT, ctx),
        content: substitute(contentT, ctx),
        tags,
        aiDeclaration: ai,
        scheduledAt: schedule ? scheduledBase : undefined,
      };
      statusEl.textContent = '发布多图笔记中…';
      const r = await fetch('/api/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then((x) => x.json());
      if (r.ok) {
        okN++;
        log(`✅ 多图笔记发布成功 → ${r.url || ''}`);
        for (const it of items) markLocalPublished(it.base, r.url);
      } else {
        failN++;
        log(`❌ 多图笔记发布失败：${r.error || '未知'}`);
      }
    } else {
      for (let i = 0; i < items.length; i++) {
        const it = items[i];
        const ctx = makeCtx(it, desc);
        const tags = tagsT.split(',').map((s) => substitute(s.trim(), ctx)).filter(Boolean);
        const scheduledAt = schedule ? addDays(scheduledBase, scheduleSeries ? i : 0) : undefined;
        const payload = { imageUrl: it.full, title: substitute(titleT, ctx), content: substitute(contentT, ctx), tags, aiDeclaration: ai, scheduledAt };
        statusEl.textContent = `发布中 ${i + 1}/${items.length} …`;
        const r = await fetch('/api/publish', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }).then((x) => x.json());
        if (r.ok) { okN++; log(`✅ [${i + 1}] 发布成功 → ${r.url || ''}`); markLocalPublished(it.base, r.url); }
        else { failN++; log(`❌ [${i + 1}] 失败：${r.error || ('url: ' + (r.url || '无'))}`); }
        if (i < items.length - 1) await sleep(1500); // 间隔防风控
      }
    }
  } catch (e) { failN++; log(`❌ 异常：${e.message}`); }
  // 收藏视图下，把已发布的图重排到最后
  if (mode === 'fav') { flatList = sortedFavList(favFlat); renderGrid(); }
  statusEl.textContent = `完成：成功 ${okN} / 失败 ${failN}`;
  btn.disabled = false;
};

document.getElementById('backBtn').onclick = () => { window.location.href = '/'; };

// ---- 启动：只先拉一页，其余滚动时再加载 ----
(async () => {
  states = await (await fetch('/api/image-states')).json().catch(() => ({}));
  await loadTemplates();
  // 默认按「仅显示收藏图」勾选状态决定首屏加载源
  if (onlyFavEl.checked) await loadFav();
  else await loadNextPage();
  // 定时发布默认值：今天 09:00
  const now = new Date();
  document.getElementById('scheduleDate').value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  document.getElementById('scheduleTime').value = '09:00';
})();
</script>
